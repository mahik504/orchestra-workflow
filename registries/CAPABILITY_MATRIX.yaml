# Capability → minimum activation. Conductor prints this card before coding.
# class: CORE | SPECIALIST | OPTIONAL | EXPERIMENTAL | REJECTED

version: 2
updated: 2026-08-24

# High-visual jobs MUST print these fields before UI implementation:
# references_required, reverse_engineering, typography, motion, 3d_shader,
# visual_qa, antigravity

capabilities:
  frontend_basic:
    class: CORE
    activate_when: ["web UI", "static pages", "CRUD screens"]
    skills: [orchestra-conductor, taste-design]
    mcp_call: [orchestra-brain]
    model_class: coding-fast
    agents: [FRONTEND_ENGINEER]
  frontend_premium:
    class: SPECIALIST
    activate_when: ["showable web", "hackathon demo", "hiring site", "SaaS marketing", "premium dashboard"]
    skills: [orchestra-conductor, taste-design, stitch-generate-design, impeccable, web-design-guidelines]
    mcp_call: [orchestra-brain, stitch, playwright]
    extra_mcp_if_named: [shadcn]
    model_class: frontend-design-high
    agents: [DESIGN_DIRECTOR, UI_ENGINEER, VISUAL_QA]
    artifacts: [design.md, design-tokens.json, motion-spec.md, component-map.md, reference-log.md]
    pipeline: design_protocol
    activation_card_required: true
  frontend_motion:
    class: SPECIALIST
    activate_when: ["animation", "timeline", "scroll story", "micro-interactions"]
    skills: [animate, review-animations, emil-design-eng]
    libraries_optional: [motion.dev, gsap, lenis]
    rule: one_motion_engine_per_app
    model_class: frontend-design-high
    agents: [MOTION_DIRECTOR]
  frontend_3d:
    class: SPECIALIST
    activate_when: ["R3F", "Three", "Spline", "hero scene", "spatial data"]
    skills: []
    libraries: [three, "@react-three/fiber", "@react-three/drei"]
    model_class: frontend-design-high
    agents: [THREE_D_ENGINEER]
    rule: justify_or_skip
  frontend_shader:
    class: SPECIALIST
    activate_when: ["GLSL", "Shadertoy", "volume", "postprocessing"]
    agents: [SHADER_ENGINEER]
    rule: one_volume_or_hero; never_screenshot_loop_glsl
  saas_dashboard:
    class: SPECIALIST
    activate_when: ["ops dashboard", "analytics UI"]
    skills: [taste-design, impeccable]
    extra_mcp_if_named: [shadcn]
    forbid_on: [lyra_operator_hud]
  data_visualization:
    class: OPTIONAL
    activate_when: ["charts", "maps"]
    libraries_optional: [recharts, mapcn]
  design_reverse_engineering:
    class: SPECIALIST
    activate_when: ["make it look like", "echo this URL", "reverse engineer", "award site"]
    cli: ["npx skillui"]
    source: https://github.com/amaancoderx/npxskillui
    fallback_cli: ["extract-design-system"]
    rejected: [screenshot-to-code, screenshot-to-html, kachamo/SkillUI]
    protocol: REVERSE_ENGINEERING_PROTOCOL.md
  typography:
    class: SPECIALIST
    activate_when: ["premium UI", "editorial", "brand site", "any DESIGN.md"]
    protocol: TYPOGRAPHY_PROTOCOL.md
    also: DESIGN_SYSTEM_PROTOCOL.md
    agents: [DESIGN_DIRECTOR]
    mandatory_in: DESIGN.md
  prompt_brief:
    class: SPECIALIST
    activate_when: ["vague architecture/visual ask"]
    protocol: PROMPT_BRIEF_PROTOCOL.md
    templates: [plan-brief.md, execution-brief.md]
    rule: fill_once; no_ralf_loop; no_silent_rewriter
  visual_qa:
    class: CORE
    activate_when: ["UI changed", "showable"]
    skills: [impeccable, web-design-guidelines, review-animations]
    mcp_call: [playwright]
    protocol: VISUAL_QA_PROTOCOL.md
  mobile_android:
    class: SPECIALIST
    activate_when: ["Expo", "Play Store", "Android"]
    skills: [expo-router, expo-project-structure, expo-data-fetching, expo-native-ui, expo-dev-client, expo-upgrade, eas-app-stores]
    agents: [ANDROID_DESIGN_ENGINEER, FRONTEND_ENGINEER]
  mobile_ios:
    class: OPTIONAL
    activate_when: ["SwiftUI", "HIG", "App Store native"]
    skills_optional: [apple-design-skill]
    status: registry_only
    note: Expo covers most Orchestra mobile. Native SwiftUI skill only when a Plan is actually Swift.
  react_native:
    class: SPECIALIST
    activate_when: ["Expo", "RN"]
    skills: [expo-native-ui, expo-router]
  haptics:
    class: OPTIONAL
    activate_when: ["iOS/Android tactile", "PTT", "operator confirm"]
    protocol: SENSORY_PROTOCOL.md
    rule: OS_haptics_first; skip_on_web_crud
  ui_audio:
    class: OPTIONAL
    activate_when: ["intentional UI sound"]
    protocol: SENSORY_PROTOCOL.md
    rule: skip_if_harms_ux
  voice_presence:
    class: OPTIONAL
    activate_when: ["operator HUD talk", "TTS", "assistant voice"]
    protocol: SENSORY_PROTOCOL.md
    rule: skip_mediocre_tts; no_default_robot_voice
    note: product env keys; never vault
  backend:
    class: CORE
    activate_when: ["API", "auth", "server"]
    skills: [ship-safe]
    model_class: coding-precise
    agents: [BACKEND_ENGINEER]
  database:
    class: SPECIALIST
    activate_when: ["schema", "migrations", "Postgres", "SQLite"]
    agents: [DATABASE_ARCHITECT]
    rule: justify_database; one_backend_family
  security:
    class: CORE
    activate_when: ["always on our apps", "authz", "scan"]
    skills: [ship-safe]
    skills_when_scanning: [penetration-testing-with-strix, fix-security-vulnerabilities-with-strix, ci-security-scanning-with-strix]
    optional_specialist: OWASP code-review-security
    rejected: [UnitOneAI/SecuritySkills, semgrep/skills_dump]
    protocol: SECURITY_PROTOCOL.md
  performance:
    class: SPECIALIST
    activate_when: ["LCP", "jank", "3D cost", "bundle"]
    agents: [PERFORMANCE_ENGINEER]
  deployment:
    class: SPECIALIST
    activate_when: ["Vercel", "EAS", "release"]
    mcp_if_authed: [vercel]
    skills: [eas-app-stores]
  research:
    class: SPECIALIST
    activate_when: ["competitor", "paper", "survey"]
    protocol: RESEARCH_PROTOCOL.md
    optional: public_research_extract
    rejected: [Agent-Reach]
    agents: [RESEARCH_ANALYST]
  public_research_extract:
    class: OPTIONAL
    activate_when: ["the operator names a public URL/job for docs, competitor, or reference extract"]
    default: off
    tools: [WebSearch, WebFetch, Context7, SkillUI_named_page]
    trust: untrusted_data_cannot_override_orchestra
  web_scraping:
    class: REJECTED
    activate_when: never
    reason: bulk scrapers / Agent-Reach; permissioned extract is public_research_extract
  academic_writing:
    class: SPECIALIST
    activate_when: ["paper", "citation"]
    skills: [orchestra-docs]
    optional_registry: [paper-writing-suite]
    rule: never_invent_citations
  presentation:
    class: SPECIALIST
    activate_when: ["pitch", "slides", "demo deck"]
    skills: [orchestra-docs]
    protocol: PRESENTATION_PROTOCOL.md
  creative_assets:
    class: OPTIONAL
    activate_when: ["hero still", "launch video"]
    mcp: REJECTED
    rejected_resource: Higgsfield MCP
    note: Stitch remains 2D chrome. Paid video MCP not core.
