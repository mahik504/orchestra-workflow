name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./runtime
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.22'

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Check gofmt
      run: |
        unformatted=$(gofmt -l . | grep -v '^benchmarks/fixtures/t3-debug/' || true)
        if [ -n "$unformatted" ]; then
          echo "gofmt would change:"
          echo "$unformatted"
          exit 1
        fi

    - name: Validate runtime schema JSON
      run: |
        shopt -s nullglob
        files=(./schemas/*.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no runtime schemas found"
          exit 1
        fi
        for file in "${files[@]}"; do
          jq empty "$file"
        done

    - name: Test
      run: |
        go test -v ./... > test.log 2>&1 || {
          while IFS= read -r line; do
            if [[ "$line" == *"--- FAIL"* || "$line" == *"FAIL:"* || "$line" == *"panic:"* ]]; then
              echo "::error::$line"
            fi
          done < test.log
          cat test.log
          exit 1
        }

  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: runtime/package-lock.json
    - name: Install tool dependencies
      working-directory: ./runtime
      run: npm ci
    - name: Tool tests
      run: node --test runtime/tools/*.test.mjs
    - name: Registry schemas
      run: node runtime/tools/check-schemas.mjs
    - name: Mermaid parse
      run: node runtime/tools/check-mermaid.mjs
    - name: Skills guide freshness
      run: |
        node runtime/tools/build-skills-guide.mjs
        git diff --exit-code -- docs/skills.md

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Sync dry-run
      shell: pwsh
      run: powershell -NoProfile -ExecutionPolicy Bypass -File kit/sync-ides.ps1
