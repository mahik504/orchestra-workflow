name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./runtime
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.22'

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Check gofmt
      run: |
        unformatted=$(gofmt -l . | grep -v '^benchmarks/fixtures/t3-debug/' || true)
        if [ -n "$unformatted" ]; then
          echo "gofmt would change:"
          echo "$unformatted"
          exit 1
        fi

    - name: Validate runtime schema JSON
      run: |
        shopt -s nullglob
        files=(./schemas/*.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no runtime schemas found"
          exit 1
        fi
        for file in "${files[@]}"; do
          jq empty "$file"
        done

    - name: Test
      run: |
        go test -v ./... > test.log 2>&1 || {
          while IFS= read -r line; do
            if [[ "$line" == *"--- FAIL"* || "$line" == *"FAIL:"* || "$line" == *"panic:"* ]]; then
              echo "::error::$line"
            fi
          done < test.log
          cat test.log
          exit 1
        }

  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: runtime/package-lock.json
    - name: Install tool dependencies
      working-directory: ./runtime
      run: npm ci
    - name: Tool tests
      run: node --test runtime/tools/*.test.mjs
    - name: Registry schemas
      run: node runtime/tools/check-schemas.mjs
    - name: Diagram freshness
      run: |
        node docs/diagrams/assets/render-readme-diagrams.mjs
        git diff --exit-code -- docs/diagrams/assets/*.svg

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Sync dry-run
      shell: pwsh
      run: powershell -NoProfile -ExecutionPolicy Bypass -File kit/sync-ides.ps1
