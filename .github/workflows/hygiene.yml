name: Hygiene

# Public-repo guard. The same scripts run locally.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install tool dependencies
        working-directory: ./runtime
        run: npm ci

      - name: Personal data, secrets, VERSION, and contract check
        run: node runtime/tools/hygiene.js

      - name: Registry integrity
        run: node runtime/tools/check-registry.js

      - name: Registry schemas
        run: node runtime/tools/check-schemas.mjs

      - name: Host-stack skill parity
        run: node runtime/tools/check-host-stack.js

      - name: Skill manifest
        run: node runtime/tools/check-skills.js

      - name: Version manifest
        run: node runtime/tools/check-versions.js

      - name: No private workspace committed
        run: |
          set -e
          for p in projects memory/career.md memory/local-notes.md Preferences.md routes.md mcp_config.json; do
            if [ -e "$p" ]; then
              echo "::error::forbidden path committed to the public repo: $p"
              exit 1
            fi
          done
          echo "no forbidden paths"
